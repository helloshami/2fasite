<body>

<a class="skip-link" href="#main">
  Skip to content
</a>

<header class="site-header">

  <div class="container">

    <a href="/" class="logo" aria-label="2FASite Home">

      <img
        src="assets/logo.svg"
        alt="2FASite"
        width="40"
        height="40">

    <nav class="top-nav">

      <a href="pages/faq.html">FAQ</a>

      <a href="pages/privacy.html">Privacy</a>

        id="themeToggle"
        class="icon-button"
        aria-label="Toggle color theme">

        🌙

      </button>

    </nav>

  </div>

</header>

<main id="main">

<section class="hero">

<div class="container">

<h1>

Browser TOTP Generator

</h1>

<p>

Generate secure authentication codes completely inside your browser.

Nothing is uploaded.

Nothing is stored.

</p>

</div>

</section>

<section class="generator">

<div class="container">

<div class="card">

<form id="totpForm" autocomplete="off">

<label for="secret">

Secret Key

</label>

<input
id="secret"
name="secret"
type="text"
spellcheck="false"
autocapitalize="off"
autocomplete="off"
placeholder="JBSWY3DPEHPK3PXP"
required>

<div class="button-row">

<button
type="button"
id="pasteBtn">

Paste

</button>

<button
type="button"
id="clearBtn">

Clear

</button>

</div>
